<section class="dictionary-table-container">
  <mat-table [dataSource]="filteredWords()" class="mat-elevation-z2">
    <!-- Identifiant -->
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef> ID </mat-header-cell>
      <mat-cell *matCellDef="let word"> {{ word.id }} </mat-cell>
    </ng-container>

    <!-- Texte principal -->
    <ng-container matColumnDef="text">
      <mat-header-cell *matHeaderCellDef> Mot/Phrase </mat-header-cell>
      <mat-cell *matCellDef="let word"> {{ word.text }} </mat-cell>
    </ng-container>

    <!-- Type d'entrée -->
    <ng-container matColumnDef="type">
      <mat-header-cell *matHeaderCellDef> Type </mat-header-cell>
      <mat-cell *matCellDef="let word"> {{ word.type }} </mat-cell>
    </ng-container>

    <!-- Traductions -->
    <ng-container matColumnDef="translations">
      <mat-header-cell *matHeaderCellDef> Traductions </mat-header-cell>
      <mat-cell *matCellDef="let word">
        <div class="translations">
          @for (t of word.translations; track t) {
            <span>
              <strong>{{ t.language }}:</strong> {{ t.text }}
            </span>
          }
        </div>
      </mat-cell>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
      <mat-cell *matCellDef="let word">
        <button mat-icon-button (click)="onEdit(word)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="onDelete(word)"><mat-icon>delete</mat-icon></button>
        <button mat-icon-button color="accent" (click)="onVirtualDelete(word)"><mat-icon>remove_circle_outline</mat-icon></button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="['id', 'text', 'type', 'translations', 'actions']"></mat-header-row>
    <mat-row *matRowDef="let row; columns: ['id', 'text', 'type', 'translations', 'actions'];"></mat-row>
  </mat-table>

  <mat-paginator [length]="filteredWords().length" [pageSize]="pageSize()" [pageIndex]="pageIndex()"></mat-paginator>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Recherche</mat-label>
    <input matInput [value]="filter()" (input)="filter.set($event.target.value)" placeholder="Rechercher un mot ou une traduction...">
  </mat-form-field>
</section>
